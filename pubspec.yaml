name: kitaplik
description: Evdeki kitaplığı raf, okuma tarihi ve kalınan sayfa bilgisiyle takip eden Flutter uygulaması (ISBN barkod tarama + Open Library desteği).
publish_to: 'none'
version: 1.18.0+22

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  equatable: ^3.0.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  mobile_scanner: ^7.5.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  file_picker: ^10.0.0
  flutter_local_notifications: ^23.0.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
